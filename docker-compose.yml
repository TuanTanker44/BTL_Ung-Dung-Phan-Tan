
services:
  # --- Message Broker ---
  rabbitmq:
    image: rabbitmq:3-management-alpine
    container_name: image_pipeline_rabbitmq
    ports:
      - "5672:5672"
      - "15672:15672"
    environment:
      RABBITMQ_DEFAULT_USER: guest
      RABBITMQ_DEFAULT_PASS: guest
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "check_running"]
      interval: 10s
      timeout: 5s
      retries: 5

  # --- Object Storage (Data Lake) ---
  minio:
    image: cgr.dev/chainguard/minio:latest
    container_name: image_pipeline_minio
    ports:
      - "9000:9000"
      - "9001:9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    command: server /data --console-address ":9001"
    volumes:
      - minio_data:/data

  # --- Data Warehouse ---
  clickhouse:
    image: clickhouse/clickhouse-server:latest
    container_name: image_pipeline_clickhouse
    ports:
      - "8123:8123"
      - "9009:9000"
    environment:
      - CLICKHOUSE_DB=traffic_dw
      - CLICKHOUSE_USER=default
      - CLICKHOUSE_PASSWORD=traffic_password
    ulimits:
      nofile:
        soft: 262144
        hard: 262144
    volumes:
      - ./clickhouse/schema.sql:/docker-entrypoint-initdb.d/schema.sql
      - clickhouse_data:/var/lib/clickhouse
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:8123/ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # --- Apache Spark Cluster ---
  spark-master:
    build:
      context: .
      dockerfile: spark/Dockerfile
    image: traffic-spark:3.4.1
    container_name: image_pipeline_spark_master
    environment:
      - DETECTION_MODE=${DETECTION_MODE:?Set DETECTION_MODE to mock or yolo}
      - SPARK_MODE=master
      - SPARK_RPC_AUTHENTICATION_ENABLED=no
      - SPARK_MASTER_URL=spark://spark-master:7077
      - RABBITMQ_HOST=rabbitmq
      - RABBITMQ_PORT=5672
      - MINIO_ENDPOINT=minio:9000
      - MINIO_ACCESS_KEY=minioadmin
      - MINIO_SECRET_KEY=minioadmin
      - CLICKHOUSE_HOST=clickhouse
      - CLICKHOUSE_PORT=8123
      - CLICKHOUSE_DB=traffic_dw
      - CLICKHOUSE_USER=default
      - CLICKHOUSE_PASSWORD=traffic_password
    ports:
      - "7077:7077"
      - "8080:8080"
    volumes:
      - ./spark:/opt/spark-jobs

  spark-worker:
    image: traffic-spark:3.4.1
    container_name: image_pipeline_spark_worker
    depends_on:
      - spark-master
    environment:
      - SPARK_MODE=worker
      - SPARK_MASTER_URL=spark://spark-master:7077
      - SPARK_WORKER_CORES=2
      - SPARK_WORKER_MEMORY=2G
      - SPARK_RPC_AUTHENTICATION_ENABLED=no
      - RABBITMQ_HOST=rabbitmq
      - RABBITMQ_PORT=5672
      - MINIO_ENDPOINT=minio:9000
      - MINIO_ACCESS_KEY=minioadmin
      - MINIO_SECRET_KEY=minioadmin
      - CLICKHOUSE_HOST=clickhouse
      - CLICKHOUSE_PORT=8123
      - CLICKHOUSE_DB=traffic_dw
      - CLICKHOUSE_USER=default
      - CLICKHOUSE_PASSWORD=traffic_password
    ports:
      - "8081:8081"
    volumes:
      - ./spark:/opt/spark-jobs

  # --- Postgres for Airflow Metadata ---
  airflow-db:
    image: postgres:13-alpine
    container_name: image_pipeline_airflow_db
    environment:
      POSTGRES_USER: airflow
      POSTGRES_PASSWORD: airflow
      POSTGRES_DB: airflow
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U airflow"]
      interval: 10s
      timeout: 5s
      retries: 5

  # --- Apache Airflow Initialization ---
  airflow-init:
    image: apache/airflow:2.6.3-python3.9
    container_name: image_pipeline_airflow_init
    depends_on:
      - airflow-db
    environment:
      - AIRFLOW__DATABASE__SQL_ALCHEMY_CONN=postgresql+psycopg2://airflow:airflow@airflow-db/airflow
      - AIRFLOW__CORE__EXECUTOR=LocalExecutor
    entrypoint: /bin/bash
    command:
      - -c
      - |
        airflow db init
        airflow users create \
          --username admin \
          --firstname Admin \
          --lastname User \
          --role Admin \
          --email admin@example.com \
          --password admin

  # --- Apache Airflow Webserver ---
  airflow-webserver:
    image: apache/airflow:2.6.3-python3.9
    container_name: image_pipeline_airflow_webserver
    depends_on:
      airflow-db:
        condition: service_healthy
    environment:
      - AIRFLOW__DATABASE__SQL_ALCHEMY_CONN=postgresql+psycopg2://airflow:airflow@airflow-db/airflow
      - AIRFLOW__CORE__EXECUTOR=LocalExecutor
      - AIRFLOW__CORE__LOAD_EXAMPLES=False
    ports:
      - "8085:8080"
    volumes:
      - ./airflow/dags:/opt/airflow/dags
      - ./spark:/opt/spark-jobs
    command: webserver
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/health"]
      interval: 10s
      timeout: 5s
      retries: 5

  # --- Apache Airflow Scheduler ---
  airflow-scheduler:
    build:
      context: .
      dockerfile: airflow/Dockerfile
    image: traffic-airflow:2.6.3
    container_name: image_pipeline_airflow_scheduler
    depends_on:
      airflow-db:
        condition: service_healthy
    environment:
      - DETECTION_MODE=${DETECTION_MODE:?Set DETECTION_MODE to mock or yolo}
      - AIRFLOW__DATABASE__SQL_ALCHEMY_CONN=postgresql+psycopg2://airflow:airflow@airflow-db/airflow
      - AIRFLOW__CORE__EXECUTOR=LocalExecutor
      - AIRFLOW__CORE__LOAD_EXAMPLES=False
      - SPARK_MASTER_URL=spark://spark-master:7077
      - MINIO_ENDPOINT=minio:9000
      - MINIO_ACCESS_KEY=minioadmin
      - MINIO_SECRET_KEY=minioadmin
      - RABBITMQ_HOST=rabbitmq
      - RABBITMQ_USER=guest
      - RABBITMQ_PASS=guest
      - RABBITMQ_QUEUE=image_processing_queue
      - CLICKHOUSE_HOST=clickhouse
      - CLICKHOUSE_PORT=8123
      - CLICKHOUSE_DB=traffic_dw
      - CLICKHOUSE_USER=default
      - CLICKHOUSE_PASSWORD=traffic_password
    volumes:
      - ./airflow/dags:/opt/airflow/dags
      - ./spark:/opt/spark-jobs
    command: scheduler

volumes:
  minio_data:
  rabbitmq_data:
  clickhouse_data:
